title: AI for Astronomy
description: Learn how artificial intelligence is used in modern astronomy — free, beginner-friendly, and hands-on.
theme: null
remote_theme: just-the-docs/just-the-docs

url: https://open-astro-lab.github.io
baseurl: /AI-for-astronomy

permalink: pretty
exclude: ["node_modules/", "*.gemspec", "*.gem", "Gemfile", "Gemfile.lock", "LICENSE"]

search_enabled: true
search:
  heading_level: 2
  previews: 3

heading_anchors: true
nav_sort: case_insensitive

aux_links:
  "Enroll free":
    - "https://tally.so/r/xX75PJ"
  "Open Astro Physics Lab":
    - "https://openastrophysicslab.wixsite.com/open-astro-physics-l"
  "GitHub":
    - "https://github.com/open-astro-lab/AI-for-astronomy"

aux_links_new_tab: true

footer_content: "AI for Astronomy · Free · Open source · Open Astro Physics Lab"

color_scheme: dark

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/open-astro-lab/AI-for-astronomy"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme
