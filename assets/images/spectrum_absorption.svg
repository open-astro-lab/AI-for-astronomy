<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <linearGradient id="rain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4b0082"/>
      <stop offset="20%" stop-color="#0000ff"/>
      <stop offset="40%" stop-color="#00ff00"/>
      <stop offset="60%" stop-color="#ffff00"/>
      <stop offset="80%" stop-color="#ff7f00"/>
