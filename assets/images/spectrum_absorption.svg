  <rect x="20" y="50" width="600" height="70" fill="url(#rain)" rx="4"/>
  <rect x="90" y="50" width="6" height="70" fill="#0b1220"/>
  <rect x="160" y="50" width="4" height="70" fill="#0b1220"/>
